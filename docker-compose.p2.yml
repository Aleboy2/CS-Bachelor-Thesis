# =============================================================================
# P2 — CQRS (Command Query Responsibility Segregation)
# =============================================================================
name: benchmark-p2
# Architecture: Mosquitto → Ingest API → MongoDB (telemetry_raw) + Kafka
#               Go worker consumes Kafka continuously, upserts into
#               telemetry_aggregated (zone_daily, cultivation_daily,
#               cultivation_180d_rollup, latest_by_sensor).
#               Dashboard queries read from telemetry_aggregated.
# =============================================================================

services:
  mongodb:
    image: mongo:7.0
    container_name: benchmark-mongodb-p2
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data-p2:/data/db
      - ./mongo-init/p2p3:/docker-entrypoint-initdb.d:ro
    environment:
      MONGO_INITDB_DATABASE: iot_benchmark
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Kafka (KRaft mode, no Zookeeper) — to be added
  # Mosquitto MQTT broker — to be added
  # Ingest API (Node.js) — to be added
  # Go background worker (continuous) — to be added

volumes:
  mongodb-data-p2:
