# =============================================================================
# Mosquitto MQTT Broker — Benchmark Configuration
# =============================================================================
# LAYER: Messaging (transport only — the broker holds no benchmark logic).
#
# SENDERS:   real sensors or the Go synthetic data generator, publishing to
#            the single flat topic "sensors/telemetry".
# RECEIVERS: the ingest API (ingest-api/src/index.js), the only subscriber,
#            once at startup.
#
# Identical across all three prototypes (P1/P2/P3). Mosquitto is constant
# infrastructure, not a benchmark variable (benchmark_schema_design_v41.pdf §9.1).
#
# No authentication — matches the no-auth decision for MongoDB
# (documented methodology simplification, CLAUDE.md §2).
# =============================================================================

listener 1883
allow_anonymous true

# No disk persistence — messages are consumed immediately by the ingest API.
# Persistence would add I/O overhead that isn't part of the research question.
persistence false

# Log to stdout so Docker captures it.
log_dest stdout
log_type error
log_type warning
log_type notice
